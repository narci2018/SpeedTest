name: Release

# 推送 v* 标签时自动编译打包并发布 Release；也可在 Actions 页手动触发（仅构建不发布）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      # 注意：fail-fast 是 strategy 的属性，放 matrix 里会被当成矩阵维度而报
      # "Unexpected value 'false'"（矩阵维度值必须是数组）
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (${{ matrix.rid }})
        run: dotnet publish SpeedProGUI/SpeedPro.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o out/${{ matrix.rid }}

      - name: Bundle engines
        shell: pwsh
        run: |
          # x64 基础引擎集（ethr/iperf3+cygwin/pingularity 无官方 arm64 构建，arm64 包内以 x64 兼容模式运行）
          Copy-Item engines/x64/* out/${{ matrix.rid }}/ -Force
          # arm64 专属构建覆盖同名引擎（speedtest-go / librespeed-cli）
          if (Test-Path "engines/${{ matrix.rid }}") { Copy-Item engines/${{ matrix.rid }}/* out/${{ matrix.rid }}/ -Force }
          Get-ChildItem out/${{ matrix.rid }} | Select-Object Name, Length

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path "out/${{ matrix.rid }}/*" -DestinationPath "SpeedPro-$tag-${{ matrix.rid }}.zip" -Force
          Get-ChildItem *.zip | Select-Object Name, Length

      - name: Upload build artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: SpeedPro-${{ github.ref_name }}-${{ matrix.rid }}
          path: SpeedPro-*.zip
          if-no-files-found: error

  # 自包含单文件构建（免装 .NET Runtime，体积更大）
  build-sc:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
        fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained single-file (${{ matrix.rid }})
        run: dotnet publish SpeedProGUI/SpeedPro.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o out-sc/${{ matrix.rid }}

      - name: Bundle engines
        shell: pwsh
        run: |
          Copy-Item engines/x64/* out-sc/${{ matrix.rid }}/ -Force
          if (Test-Path "engines/${{ matrix.rid }}") { Copy-Item engines/${{ matrix.rid }}/* out-sc/${{ matrix.rid }}/ -Force }
          Get-ChildItem out-sc/${{ matrix.rid }} | Select-Object Name, Length

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path "out-sc/${{ matrix.rid }}/*" -DestinationPath "SpeedPro-$tag-${{ matrix.rid }}-sc.zip" -Force
          Get-ChildItem *.zip | Select-Object Name, Length

      - name: Upload build artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: SpeedPro-${{ github.ref_name }}-${{ matrix.rid }}-sc
          path: SpeedPro-*.zip
          if-no-files-found: error

  # 集中发布：收集所有产物，一次创建 Release
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, build-sc]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: zips

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: zips/*.zip
          generate_release_notes: true
          body: |
            ## SpeedPro ${{ github.ref_name }}

            | 压缩包 | 架构 | 运行要求 |
            |---|---|---|
            | `SpeedPro-${{ github.ref_name }}-win-x64.zip` | x64 | .NET 8 Desktop Runtime |
            | `SpeedPro-${{ github.ref_name }}-win-arm64.zip` | ARM64 | .NET 8 Desktop Runtime |
            | `SpeedPro-${{ github.ref_name }}-win-x64-sc.zip` | x64 | 无需安装运行时 |
            | `SpeedPro-${{ github.ref_name }}-win-arm64-sc.zip` | ARM64 | 无需安装运行时 |

            **安装与运行**
            1. `-sc.zip` 为自包含单文件版，解压即用；普通 zip 需先安装 [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0)（对应架构）。
            2. 解压即用——五个测速引擎（speedtest-go / librespeed-cli / ethr / iperf3+cygwin1.dll / pingularity）已内置。
               ARM64 包中的 ethr、iperf3、pingularity 为 x64 构建，Windows 11 ARM64 通过 x64 模拟运行。
            3. 如需测试被墙网站，先在 设置 → 代理服务器 配置本地代理。

            > 由 GitHub Actions 自动构建：`dotnet publish -c Release`。
